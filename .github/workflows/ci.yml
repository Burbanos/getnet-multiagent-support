name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
      - name: Compile scripts, src and tests on Python 3.11
        run: |
          python -m compileall -q scripts src tests
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Run Pytest
        run: |
          pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: |
          docker build -t getnet-app .
      - name: Run container and probe health
        run: |
          docker run -d -p 8000:8000 --name app getnet-app
          timeout=60
          elapsed=0
          until [ $(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health) -eq 200 ]; do
            if [ $elapsed -ge $timeout ]; then
              echo "Healthcheck timed out after ${timeout}s"
              docker logs app
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed+2))
          done
          echo "Health check succeeded!"
          test "$(docker exec app id -u)" != "0"
          docker exec app sh -c '! test -w /app/data/index/chunks.jsonl && ! test -w /app/src/main.py && test -w /app/state'
          docker logs app
