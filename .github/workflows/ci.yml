name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
      - name: Compile scripts, src and tests on Python 3.11
        run: |
          python -m compileall -q scripts src tests
      - name: Validate Prometheus alert rules with promtool
        run: |
          docker run --rm --entrypoint="" -v "${PWD}:/work:ro" -w /work prom/prometheus:v2.55.1 promtool check rules deploy/alerts.yml
          docker run --rm --entrypoint="" -v "${PWD}:/work:ro" -w /work prom/prometheus:v2.55.1 promtool test rules deploy/alerts_test.yml
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Run Pytest
        run: |
          pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getnet
          POSTGRES_PASSWORD: ci_pg_password
          POSTGRES_DB: getnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U getnet -d getnet_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
      - name: Run integration tests against Postgres and Redis
        env:
          TEST_DATABASE_URL: postgresql://getnet:ci_pg_password@localhost:5432/getnet_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -m integration -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start Postgres, Redis, and two app replicas via Compose
        run: |
          cp .env.example .env
          CUST_KEY=$(python3 -c "import secrets; print(secrets.token_hex(16))")
          OP_KEY=$(python3 -c "import secrets; print(secrets.token_hex(16))")
          RL_KEY=$(python3 -c "import secrets; print(secrets.token_hex(16))")
          JWT_K1=$(python3 -c "import secrets; print('k1:' + secrets.token_hex(24))")
          API_KEYS=$(python3 -c "import hashlib; print(';'.join([hashlib.sha256('${CUST_KEY}'.encode()).hexdigest()+':cliente1988:customer', hashlib.sha256('${OP_KEY}'.encode()).hexdigest()+':operador_ci:operator', hashlib.sha256('${RL_KEY}'.encode()).hexdigest()+':cliente_rl:customer']))")
          python3 -c "from pathlib import Path; lines = [ln for ln in Path('.env').read_text().splitlines() if not ln.startswith(('POSTGRES_PASSWORD=', 'RATE_LIMIT_PER_MINUTE=', 'API_KEYS=', 'JWT_SIGNING_KEYS=', 'JWT_ACTIVE_KID='))]; lines += ['POSTGRES_PASSWORD=ci-postgres-pass', 'RATE_LIMIT_PER_MINUTE=4', 'API_KEYS=${API_KEYS}', 'JWT_SIGNING_KEYS=${JWT_K1}', 'JWT_ACTIVE_KID=k1']; Path('.env').write_text('\n'.join(lines) + '\n')"
          echo "CUST_KEY=${CUST_KEY}" >> "$GITHUB_ENV"
          echo "OP_KEY=${OP_KEY}" >> "$GITHUB_ENV"
          echo "RL_KEY=${RL_KEY}" >> "$GITHUB_ENV"
          echo "CI_API_KEYS=${API_KEYS}" >> "$GITHUB_ENV"
          echo "CI_JWT_KEYS=${JWT_K1}" >> "$GITHUB_ENV"
          docker compose up -d --build --wait postgres redis app-a app-b
      - name: Check health, tokens, SSE, security, shared tickets, shared rate limit, restart, and standalone fail-fast
        run: |
          for port in 8000 8001; do
            code=$(curl -s -o /tmp/h_${port}.json -w "%{http_code}" http://localhost:${port}/health)
            test "$code" = "200"
            python3 -c "import json; h = json.load(open('/tmp/h_${port}.json')); assert h['environment'] == 'production' and h['state_backend'] == 'postgres' and h['rate_limit_backend'] == 'redis', h"
          done

          test "$(docker compose exec -T app-a id -u)" != "0"
          docker compose exec -T app-a sh -c '! test -w /app/data/index/chunks.jsonl && ! test -w /app/src/main.py'

          # Direct X-API-Key rejected in production
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/tickets -H "X-API-Key: ${CUST_KEY}")
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/chat -H "Content-Type: application/json" -H "X-API-Key: getnet-dev-key" -d '{"message": "oi"}')
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/tickets -H "X-API-Key: getnet-dev-operator")
          test "$code" = "401"

          # Exchange keys for short-lived Bearer tokens
          CUST_TOK=$(curl -sf -X POST http://localhost:8000/auth/token -H "X-API-Key: ${CUST_KEY}" | python3 -c "import json, sys; print(json.load(sys.stdin)['access_token'])")
          OP_TOK=$(curl -sf -X POST http://localhost:8000/auth/token -H "X-API-Key: ${OP_KEY}" | python3 -c "import json, sys; print(json.load(sys.stdin)['access_token'])")
          RL_TOK=$(curl -sf -X POST http://localhost:8000/auth/token -H "X-API-Key: ${RL_KEY}" | python3 -c "import json, sys; print(json.load(sys.stdin)['access_token'])")

          TID=$(docker compose exec -T app-a python -c "from src.core.tickets_db import get_tickets_repository; t = get_tickets_repository().create_ticket(user_id='cliente1988', reason='ci cross replica', session_id='ci-sse-sess'); print(t['ticket_id'])" | tail -n 1 | tr -d '\r')
          echo "$TID" | grep -Eq '^GET-TKT-[0-9]{8}-[0-9A-F]{10}$'
          code=$(curl -s -o /tmp/tkt_b.json -w "%{http_code}" http://localhost:8001/tickets/${TID} -H "Authorization: Bearer ${CUST_TOK}")
          test "$code" = "200"

          # Cross-replica SSE notification: listen on app-a (8000), PATCH reply on app-b (8001)
          curl -sN --max-time 6 http://localhost:8000/sessions/ci-sse-sess/events -H "Authorization: Bearer ${CUST_TOK}" > /tmp/ci_sse.log &
          SSE_PID=$!
          sleep 1
          code=$(curl -s -o /tmp/tkt_patch.json -w "%{http_code}" -X PATCH http://localhost:8001/tickets/${TID} -H "Content-Type: application/json" -H "Authorization: Bearer ${OP_TOK}" -d '{"reply": "Resposta secreta CI"}')
          test "$code" = "200"
          wait $SSE_PID || true
          grep -q "event: operator_reply" /tmp/ci_sse.log
          grep -q "${TID}" /tmp/ci_sse.log
          ! grep -q "Resposta secreta CI" /tmp/ci_sse.log

          code=$(curl -s -o /tmp/tkt_a.json -w "%{http_code}" http://localhost:8000/tickets/${TID} -H "Authorization: Bearer ${CUST_TOK}")
          test "$code" = "200"
          python3 -c "import json; t = json.load(open('/tmp/tkt_a.json')); assert t['status'] == 'answered', t"

          for port in 8000 8000 8001 8001; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:${port}/chat -H "Content-Type: application/json" -H "Authorization: Bearer ${RL_TOK}" -d '{"message": "oi"}')
            test "$c" != "429"
          done
          c5=$(curl -s -D /tmp/rl5_headers.txt -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/chat -H "Content-Type: application/json" -H "Authorization: Bearer ${RL_TOK}" -d '{"message": "oi"}')
          test "$c5" = "429"
          grep -qi "^Retry-After:" /tmp/rl5_headers.txt

          docker compose restart app-a
          timeout=60
          elapsed=0
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)" = "200" ]; do
            if [ $elapsed -ge $timeout ]; then
              echo "app-a health timed out after restart"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed+2))
          done
          curl -s http://localhost:8000/tickets/${TID} -H "Authorization: Bearer ${CUST_TOK}" | python3 -c "import json, sys; t = json.load(sys.stdin); assert t['status'] == 'answered', t"

          set +e
          timeout 30 docker run --rm --name standalone-no-db -e APP_ENV=production -e "API_KEYS=${CI_API_KEYS}" -e "JWT_SIGNING_KEYS=${CI_JWT_KEYS}" -e "JWT_ACTIVE_KID=k1" getnet-multiagent-app:local > /tmp/standalone.log 2>&1
          rc=$?
          set -e
          cat /tmp/standalone.log
          test "$rc" -ne 0
          grep -q "DATABASE_URL" /tmp/standalone.log

          cp .env.example .env
          docker compose config | grep -E "^\s+APP_ENV: production$"
      - name: Dump compose logs and tear down
        if: always()
        run: |
          docker compose logs || true
          docker compose down -v
