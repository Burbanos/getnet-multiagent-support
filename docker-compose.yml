services:
  getnet-multiagent-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getnet_multiagent_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - APP_PORT=${APP_PORT:-8000}
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-google_genai}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-30.0}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - MAX_SUPERVISOR_STEPS=${MAX_SUPERVISOR_STEPS:-6}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-3}
      - DDGS_TIMEOUT=${DDGS_TIMEOUT:-8}
      - ENABLE_GUARDRAILS=${ENABLE_GUARDRAILS:-true}
      - API_KEYS=${API_KEYS:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - CHECKPOINT_DB_PATH=${CHECKPOINT_DB_PATH:-data/checkpoints.db}
      - TICKETS_DB_PATH=${TICKETS_DB_PATH:-data/tickets.db}
      - ESCALATE_AFTER_ABSTENTIONS=${ESCALATE_AFTER_ABSTENTIONS:-2}
    volumes:
      - tickets_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tickets_data:
    name: getnet_tickets_data
